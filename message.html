<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Finanças</title>
<style>
*{box-sizing:border-box}
:root{--ink:#12151c;--mute:#4d5566;--gl:rgba(255,255,255,.52);--gl0:rgba(255,255,255,.26);--gl2:rgba(255,255,255,.82);--ln:rgba(255,255,255,.75);--hi:rgba(255,255,255,.95);--sep:rgba(30,40,80,.1);--sh:rgba(40,60,130,.16);--sn:.55;--acc:#0a6cf0;--grn:#17874e;--red:#d6293f;--blk:#1d2230;--onb:#fff;--bg:#e9eef8;--bgi:radial-gradient(38% 42% at 14% 14%,#8db7ff,transparent 70%),radial-gradient(34% 40% at 86% 18%,#cdb0ff,transparent 70%),radial-gradient(40% 44% at 72% 88%,#8fe8d3,transparent 70%),radial-gradient(30% 32% at 8% 86%,#ffd3b5,transparent 70%);color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--ink:#f4f6fb;--mute:#b0b9cc;--gl:rgba(255,255,255,.09);--gl0:rgba(255,255,255,.03);--gl2:rgba(36,42,62,.84);--ln:rgba(255,255,255,.16);--hi:rgba(255,255,255,.22);--sep:rgba(255,255,255,.1);--sh:rgba(0,0,0,.45);--sn:.12;--acc:#5aa9ff;--grn:#3ddc84;--red:#ff6b7d;--blk:#f4f6fb;--onb:#12151c;--bg:#070910;--bgi:radial-gradient(38% 42% at 14% 14%,#1d3f86,transparent 70%),radial-gradient(34% 40% at 86% 18%,#40287a,transparent 70%),radial-gradient(40% 44% at 72% 88%,#0f4d49,transparent 70%),radial-gradient(30% 32% at 8% 86%,#5c3522,transparent 70%);color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:110px}
body::before{content:"";position:fixed;inset:-15%;z-index:-1;background:var(--bgi);pointer-events:none}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.g{position:relative;isolation:isolate;background:linear-gradient(145deg,var(--gl),var(--gl0));backdrop-filter:blur(30px) saturate(1.9);-webkit-backdrop-filter:blur(30px) saturate(1.9);border:1px solid var(--ln);border-radius:28px;padding:18px;box-shadow:inset 0 1.5px 0 var(--hi),inset 0 -1px 0 var(--ln),0 14px 40px var(--sh),0 2px 6px rgba(0,0,0,.04)}
.g::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 0% 0%,rgba(255,255,255,.6),transparent 55%);opacity:var(--sn)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .2s,box-shadow .2s,color .2s}
button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.b1{background:linear-gradient(180deg,#2f90ff,#0a6cf0);color:#fff;border-radius:999px;padding:9px 17px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px rgba(10,108,240,.32)}
.b2{background:var(--gl2);border:1px solid var(--ln);border-radius:999px;padding:9px 16px;font-weight:600;box-shadow:inset 0 1px 0 var(--hi),0 2px 8px var(--sh)}
.bd{background:linear-gradient(180deg,#ff5d6e,#e5334b);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px rgba(229,51,75,.32)}
.rs{color:var(--red)}
.top{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:6;display:flex;align-items:center;gap:10px;padding:8px;border-radius:999px;flex-wrap:wrap}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#5aa9ff,#8a6bff);color:#fff;display:grid;place-items:center;font-weight:650;padding:0;flex:none;background-size:cover;background-position:center;box-shadow:0 0 0 2px var(--ln),0 4px 12px var(--sh)}
.nm{flex:1;font-size:14px;font-weight:500;cursor:pointer;min-width:120px}
h1{font-size:clamp(32px,6vw,44px);font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:26px 4px 2px}
h3{margin:0 0 4px;font-size:17px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--mute);margin:4px 4px 18px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.s4{grid-column:span 4}.s8{grid-column:span 8}.s5{grid-column:span 5}.s7{grid-column:span 7}.s12{grid-column:span 12}.s3{grid-column:span 3}
@media(max-width:860px){.grid>*{grid-column:1/-1}.s3{grid-column:span 6}}
.big{font-size:clamp(28px,4.4vw,36px);font-weight:700;letter-spacing:-.03em;margin:2px 0}
.lb{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%}
.kp>div{background:linear-gradient(145deg,var(--gl),var(--gl0));border:1px solid var(--ln);border-radius:22px;padding:13px;box-shadow:inset 0 1px 0 var(--hi),0 8px 24px var(--sh);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6)}
.kp .on{background:linear-gradient(145deg,#27a46c,#1b8452);color:#fff}.kp .on .lb{color:#dcfff0}
.kp b{font-size:20px;letter-spacing:-.02em;display:block;margin-top:2px}
.bar{height:10px;border-radius:9px;background:var(--sep);overflow:hidden;margin:10px 0 6px}
.bar.sm{height:6px;margin:3px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#6ab4ff);border-radius:9px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 6px;text-align:left;border-bottom:1px solid var(--sep);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:12.5px}
tbody tr{transition:background .2s}tbody tr:hover{background:var(--sep)}
.pos{color:var(--grn);font-weight:650}.neg{font-weight:650;color:var(--red)}
.x{color:var(--mute);width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;padding:0}.x:hover{background:rgba(229,51,75,.14);color:var(--red)}
.ch{width:100%;height:auto;display:block}.ch text{fill:var(--mute);font-size:11px}.ch .gl{stroke:var(--sep);stroke-width:1}
.dn{width:170px;height:170px;flex:none}.dn text{fill:var(--ink);font-size:13px;font-weight:650}.dn .l{fill:var(--mute);font-weight:400;font-size:10px}
.rg circle:first-child,.dn g circle:first-child{stroke:var(--sep)}
.lg{display:flex;justify-content:space-between;font-size:13px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.seg{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--gl);border:1px solid var(--ln);box-shadow:inset 0 1px 2px var(--sep)}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--gl2);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi),0 2px 8px var(--sh)}
.gl2{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px;margin-top:14px}
.gc{text-align:center;padding:16px}
.rg{width:92px;height:92px}.rg text{fill:var(--ink);font-size:17px;font-weight:650}
.gc .nm2{font-weight:600;margin-top:6px}
.nw{border:1.5px dashed rgba(110,120,150,.45);display:grid;place-items:center;min-height:200px;color:var(--mute);gap:6px;align-content:center;padding:18px;text-align:center}
.pl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--sep);font-size:14px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}.fg label{display:block;font-size:13px;color:var(--mute)}
.lo{color:var(--red);font-weight:650}
details{border-top:1px solid var(--sep);padding:11px 2px}summary{cursor:pointer;font-weight:600}details p{margin:8px 0 2px;color:var(--mute)}
.note{font-size:12.5px;color:var(--mute);margin-top:10px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:center;gap:8px;padding:0 12px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock>*{pointer-events:auto}
.pill{display:flex;gap:2px;padding:6px;border-radius:999px;overflow-x:auto;max-width:calc(100vw - 84px);scrollbar-width:none}
.pill button{padding:9px 14px;border-radius:999px;font-weight:600;color:var(--mute);font-size:14px;white-space:nowrap;flex:none}
.pill button.on{background:var(--gl2);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi),0 3px 10px var(--sh)}
.fab{width:52px;height:52px;border-radius:50%;font-size:26px;padding:0;display:grid;place-items:center;color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8;display:flex;gap:14px;align-items:center;padding:8px 8px 8px 20px;border-radius:999px;font-weight:600}
.ov{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:16px;background:rgba(15,20,40,.32);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.md{width:min(400px,100%);background:var(--gl2);max-height:90vh;overflow:auto}
.md label{display:block;margin:10px 0;font-size:13px;color:var(--mute)}
input,select{width:100%;margin-top:4px;padding:11px 13px;border-radius:14px;border:1px solid var(--sep);background:var(--gl2);color:var(--ink);font:inherit;transition:box-shadow .2s,border-color .2s}
input:focus-visible,select:focus-visible{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(10,108,240,.22)}
.md .row{margin-top:16px;justify-content:flex-end}
.ck{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.md .ck label{display:flex;align-items:center;gap:12px;margin:0;padding:12px 14px;border-radius:16px;background:var(--gl);border:1px solid var(--sep);font-size:14px;line-height:1.35;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s}
.md .ck label:hover{background:var(--gl2)}
.ck input{width:20px;height:20px;margin:0;padding:0;flex:none;accent-color:var(--acc);cursor:pointer}
.ck input:checked+span{color:var(--mute)}
.hl{color:var(--acc);font-weight:700}
.b1:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
button:disabled:active{transform:none}
@media(max-width:560px){.ov{place-items:end center;padding:8px}}
.big.xl{font-size:clamp(42px,7.5vw,60px);line-height:1.05;letter-spacing:-.04em}
.md .seg{margin-bottom:8px}.md .seg button{flex:1}
.amt{text-align:center;font-weight:600}
.amt input{font-size:34px;font-weight:700;letter-spacing:-.03em;text-align:center;background:transparent;border-color:transparent;padding:6px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin:6px 0 4px}
.cg button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:18px;background:var(--gl);border:1px solid var(--sep);font-size:12.5px;font-weight:600;transition:transform .2s cubic-bezier(.34,1.56,.64,1),border-color .2s,background .2s}
.cg button:active{transform:scale(.94)}
.wimg{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:14px;margin-bottom:10px;background:var(--gl)}
.cg button span{font-size:22px}
.cg button span svg{display:block;width:24px;height:24px}
.cg button.on{background:var(--gl2);border-color:var(--acc);box-shadow:0 0 0 3px rgba(10,108,240,.2)}
.tip{position:fixed;transform:translate(-50%,-100%);z-index:10;padding:7px 12px;border-radius:14px;font-size:12.5px;font-weight:600;pointer-events:none;white-space:nowrap}
.ch [data-tip]:focus-visible,.dn [data-tip]:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media(prefers-reduced-motion:no-preference){
body::before{animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(5%,4%,0) rotate(8deg) scale(1.1)}}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes ring{from{stroke-dasharray:0 400}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}}
.enter>:not(.grid):not(.gl2),.enter .grid>*,.enter .gl2>*{animation:up .65s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
.enter .bar i{transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) .3s backwards}
.enter .ch rect{transform-box:fill-box;transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) .25s backwards}
.enter .ch path{animation:fade 1.2s .3s backwards}
.enter .rg circle+circle,.enter .dn g circle+circle{animation:ring 1.2s cubic-bezier(.2,.8,.2,1) .3s backwards}
.ov{animation:fade .2s ease-out}.md{animation:pop .35s cubic-bezier(.34,1.3,.64,1)}.toast{animation:tin .35s cubic-bezier(.34,1.3,.64,1)}
}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div class="dock"><div class="pill g"><button data-a="nav" data-v="o">Visão geral</button><button data-a="nav" data-v="g">Metas</button><button data-a="nav" data-v="r">Relatórios</button><button data-a="nav" data-v="i">Investir</button><button data-a="nav" data-v="p">Previsões</button></div><button class="fab g" data-a="add" data-t="out" aria-label="Novo lançamento">+</button></div>
<script>
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const CO=['Alimentação','Transporte','Lazer','Estudos','Saúde','Gasolina','Claude','Spotify','Outros'];
const CI=['Bolsa','Auxílio','Outros'];
const COL=['#0a84ff','#5e5ce6','#ff9f0a','#30b858','#ff375f','#bf5af2','#32ade6','#8e8e93'];
const RC=['#0a84ff','#30b858','#bf5af2','#ff9f0a','#32ade6'];
const fmt=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const k=n=>Math.abs(n)>=1000?(n/1000).toFixed(1).replace('.',',')+' mil':String(Math.round(n));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const n0=s=>{const x=parseFloat(String(s).replace(',','.'));return isNaN(x)?0:x};
const mk=d=>d.slice(0,7), cur=()=>iso(new Date()).slice(0,7), dm=d=>d.slice(8)+'/'+d.slice(5,7);
const gr=()=>{const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'};
function fresh(){return{v:2,name:'Daniel',initial:0,limit:0,custo:0,pa:.2,gl:0,sz:0,foto:'',plano:{bd:722,ad:251,bj:1050,aj:550,ini:'2026-12',mud:'2027-01'},tx:[],apps:[],pend:[],bk:'',wishes:[],goals:[{id:uid(),name:'Porquinho 🆘 🆘 🆘',target:0,saved:0,until:'',reserva:1}],sim:{ini:0,mes:0,tx:13.75,anos:5},rf:{val:1000,dias:365,cdi:13.65,selic:13.75}}}
const okD=d=>typeof d=='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(new Date(d+'T12:00:00'));
const num=v=>Number.isFinite(+v)?+v:0;
function norm(x){x=x&&typeof x=='object'?x:{};const f=fresh(),ob=(d,v)=>Object.assign(d,v&&typeof v=='object'&&!Array.isArray(v)?v:{}),r=Object.assign(f,x);
 ['tx','goals','wishes','apps','pend'].forEach(k=>{r[k]=Array.isArray(x[k])?x[k]:fresh()[k]});
 r.tx=r.tx.filter(t=>t&&(t.type=='in'||t.type=='out')&&okD(t.date)&&num(t.amt)>0).map(t=>Object.assign({},t,{id:String(t.id||uid()),amt:+t.amt,desc:String(t.desc||t.cat||''),cat:String(t.cat||'Outros')}));
 r.goals=r.goals.filter(g=>g&&typeof g=='object').map(g=>Object.assign({},g,{id:String(g.id||uid()),name:String(g.name||'Meta'),target:Math.max(0,num(g.target)),saved:Math.max(0,num(g.saved))}));
 r.apps=r.apps.filter(a=>a&&okD(a.date)&&num(a.val)>0).map(a=>Object.assign({},a,{id:String(a.id||uid()),nm:String(a.nm||'Aplicação'),val:+a.val}));
 r.pend=r.pend.filter(p=>p&&okD(p.date)&&num(p.amt)>0).map(p=>({id:String(p.id||uid()),amt:+p.amt,date:p.date}));
 ['initial','limit','custo','gl','sz'].forEach(k=>r[k]=num(r[k]));r.pa=Math.min(1,Math.max(0,num(r.pa)));
 r.plano=ob(fresh().plano,x.plano);r.sim=ob(fresh().sim,x.sim);r.rf=ob(fresh().rf,x.rf);delete r.assets;delete r.sample;return r}
function load(){let r=null;try{r=localStorage.getItem('fin-v2');if(r){const x=JSON.parse(r);if(x&&x.v==2)return norm(x)}
 r=localStorage.getItem('fin-v1');if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.tx)&&o.tx.length){const f=fresh();f.name=o.name||f.name;f.initial=o.initial||0;f.limit=o.limit||0;f.tx=o.tx;f.goals=f.goals.concat(o.goals||[]);return norm(f)}}}
 catch(e){try{if(r)localStorage.setItem('fin-v2-corrompido',r)}catch(_){}setTimeout(()=>warn('Não consegui ler os dados salvos. Guardei uma cópia bruta antes de começar do zero.'),300)}return fresh()}
let WARNED=0;
function warn(m){const t=document.createElement('div');t.className='toast g';t.setAttribute('role','alert');t.innerHTML='<span>'+m+'</span><button class="b2">OK</button>';t.querySelector('button').onclick=()=>t.remove();document.body.appendChild(t)}
function save(){try{localStorage.setItem('fin-v2',JSON.stringify(S));return true}catch(e){if(!WARNED){WARNED=1;warn('Não consegui salvar. Exporte um backup em Ajustes para não perder dados.')}return false}}
let S=load(),V='o',P='m',EN=1,SHOW=5;
const CRES='Reserva',CMETA='Meta',livre=x=>!x.goal;
const sumT=(t,f=()=>true)=>S.tx.filter(x=>x.type==t&&f(x)).reduce((a,x)=>a+x.amt,0);
const touch=()=>{save();render()};

function bars(ms){const mx=Math.max(1,...ms.flatMap(m=>[m.i,m.o]));let s='<svg viewBox="0 0 300 165" class="ch" role="img" aria-label="Receitas e gastos dos últimos 6 meses">';
 ms.forEach((m,i)=>{const x=14+i*47,a=m.i/mx*120,b=m.o/mx*120;
  s+=`<rect x="${x}" y="${132-a}" width="16" height="${a}" rx="5" fill="var(--grn)" tabindex="0" aria-label="${m.l}: receitas ${fmt(m.i)}" data-tip="${m.l}: receitas ${fmt(m.i)}"><title>${m.l}: receitas ${fmt(m.i)}</title></rect><rect x="${x+18}" y="${132-b}" width="16" height="${b}" rx="5" fill="var(--red)" tabindex="0" aria-label="${m.l}: gastos ${fmt(m.o)}" data-tip="${m.l}: gastos ${fmt(m.o)}"><title>${m.l}: gastos ${fmt(m.o)}</title></rect><text x="${x+17}" y="152" text-anchor="middle">${m.l}</text>`});
 return s+'</svg>'}
function line(a,b,lb,al='Receitas e despesas acumuladas',c2='var(--blk)'){const W=600,H=210,n=a.length,mx=Math.max(1,...a,...b);
 const X=i=>34+i*(W-50)/(n-1||1),Y=v=>H-24-v/mx*(H-44);
 const p=s=>s.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
 let g='';[0,.5,1].forEach(f=>{g+=`<line x1="34" x2="${W-14}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" class="gl"/><text x="28" y="${Y(mx*f)+4}" text-anchor="end">${k(mx*f)}</text>`});
 const st=Math.ceil(n/7),xl=lb.map((t,i)=>i%st==0?`<text x="${X(i)}" y="${H-4}" text-anchor="middle">${t}</text>`:'').join('');
 return `<svg viewBox="0 0 ${W} ${H}" class="ch" role="img" aria-label="${al}">${g}<path d="${p(a)} L${X(n-1)} ${Y(0)} L${X(0)} ${Y(0)}Z" fill="var(--acc)" opacity=".16"/><path d="${p(a)}" fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linejoin="round"/><path d="${p(b)}" fill="none" stroke="${c2}" stroke-width="2.6" stroke-linejoin="round"/>${xl}${tipRects(a,b,lb)}</svg>`}
function tipRects(a,b,lb){const n=a.length,w=550/(n-1||1);return a.map((v,i)=>`<rect x="${34+i*w-w/2}" y="0" width="${w}" height="210" fill="transparent" data-tip="${esc(lb[i])}: receitas ${fmt(v)} · gastos ${fmt(b[i])}"/>`).join('')}

function donut(ce,tot){const r=62,C=2*Math.PI*r;let o=0,s='<svg viewBox="0 0 160 160" class="dn" role="img" aria-label="Gastos por categoria"><g transform="rotate(-90 80 80)"><circle cx="80" cy="80" r="62" fill="none" stroke="var(--ln)" stroke-width="20"/>';

function ring(p,col){const r=34,C=2*Math.PI*r;return `<svg viewBox="0 0 84 84" class="rg"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--ln)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle">${Math.round(p*100)}%</text></svg>`}

function livreMedia(){const n=new Date(),lv=[];for(let i=1;i<=3;i++){const m=iso(new Date(n.getFullYear(),n.getMonth()-i,1)).slice(0,7),g=sumT('out',x=>mk(x.date)==m&&livre(x)&&!x.mg),a=sumT('in',x=>mk(x.date)==m&&x.cat=='Auxílio');if(g||a)lv.push(Math.max(0,g-a))}return lv.length?{v:lv.reduce((a,b)=>a+b,0)/lv.length,hist:1}:{v:S.gl,hist:0}}

 return{rec,ap,gasto,sz,s0,w,nm,al,sim}}

function ringTools(p){const r=36.7,C=2*Math.PI*r;return `<svg viewBox="0 0 84 84" class="rg" style="width:108px;height:108px" role="img" aria-label="Porquinho, ${Math.round(p*100)}% da reserva"><circle cx="42" cy="42" r="${r}" fill="none" style="stroke:rgba(224,112,16,.28)" stroke-width="5.6"/>${p>0?`<circle cx="42" cy="42" r="${r}" fill="none" stroke="#f07a14" stroke-width="5.6" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 42 42)"/>`:''}<image href="${TOOLS}" x="13.8" y="13.8" width="56.4" height="56.4"/></svg>`}
function vG(){const n=new Date(),P=gPlan(),a0=P.al(0),dist=Object.values(a0.o).reduce((a,b)=>a+b,0),T=S.goals.reduce((a,g)=>a+g.target,0),sv=S.goals.reduce((a,g)=>a+g.saved,0),pg=T?Math.min(sv/T,1):0;
 const cs=S.goals.map((g,i)=>{const q=g.target?Math.min(Math.max(g.saved/g.target,0),1):0,u=g.until?MES[+g.until.slice(5,7)-1]+' '+g.until.slice(0,4):'sem prazo';let t='';
  if(!g.reserva&&g.target>0&&g.saved>=g.target)t=`<b class="pos">Meta batida! Já dá para comprar à vista.</b>`;
  else if(!g.reserva&&g.target>0){const r=P.sim(g),ap=a0.o[g.id]||0,w=P.w[g.id];
   if(!r)t=`<div class="lo">🔴 Sem folga: com a sobra atual a meta não fecha em 20 anos. Reduza gastos ou o valor.</div><div class="lb" style="margin-top:4px">Aporte sugerido (mês atual): ${fmt(ap)}</div>`;
   else{const dt=new Date(n.getFullYear(),n.getMonth()+r.n,1),late=P.nm[g.id]!=null&&r.n>P.nm[g.id],cut=w>0&&ap<w-.005,s=late?['lo','🔴 Data alvo em risco: precisa de '+fmt(w)+' por mês e a sobra cobre '+fmt(ap)]:P.s0<=0&&ap==0?['lb','🟡 Sem sobra neste mês: a previsão conta com a renda dos próximos meses']:cut?['lb','🟡 Aporte reduzido: a sobra cobre só '+fmt(ap)+' dos '+fmt(w)+' planejados']:['pos','🟢 Viável, dentro da margem de segurança'];
    t=`<div class="lb">Aporte sugerido (mês atual): <b>${fmt(ap)}</b></div><div style="margin-top:4px">🛒 Compra à vista: <b>${MESF[dt.getMonth()]}/${dt.getFullYear()}</b> <span class="lb">(${r.n==1?'em 1 mês':'em '+r.n+' meses'})</span></div><div class="lb" style="margin-top:4px">Você coloca ${fmt(r.dep)} e os juros do CDB 100% do CDI pagam ${fmt(r.jur)} (${Math.round(r.jur/g.target*100)}% do valor).</div><div class="${s[0]}" style="margin-top:6px">${s[1]}</div>`}}
  return `<div class="g gc">${wimgOk(g.img)?`<img class="wimg" src="${g.img}" alt="Foto de ${esc(g.name)}" loading="lazy">`:''}${g.reserva?ringTools(q):ring(q,RC[i%5])}<div class="nm2">${esc(g.name)}</div><div class="lb">${u}</div><div class="lb" style="margin:4px 0 10px">${g.reserva?Math.round(q*100)+'% · ':''}${fmt(g.saved)} de ${fmt(g.target)}${g.mes>0&&!g.reserva?', separando '+fmt(g.mes)+' por mês':''}</div>${t?`<div style="margin:0 0 12px">${t}</div>`:''}<div class="row" style="justify-content:center"><button class="b2" data-a="money" data-id="${g.id}">+ Adicionar</button>${g.reserva?'':'<button class="b1" data-a="wbuy" data-id="'+g.id+'">Comprei</button><button class="x" data-a="delg" data-id="'+g.id+'" aria-label="Excluir meta">✕</button>'}</div></div>`}).join('');
 return `<h1>Metas</h1><p class="sub">Separe dinheiro para o que importa, de uma viagem a um headset novo, e veja o progresso. Junte com calma e compre à vista, com os juros ajudando a pagar.</p><div class="g"><div class="row"><div><div class="lb">Total guardado</div><div class="big">${fmt(sv)}</div><div class="lb">${Math.round(pg*100)}% de ${fmt(T)} em ${S.goals.length} meta${S.goals.length==1?'':'s'}</div></div><button class="b1" data-a="goal">+ Nova meta</button></div><div class="bar"><i style="width:${pg*100}%"></i></div></div><div class="g" style="margin-top:14px"><div class="lb">Sobra livre real de ${MESF[n.getMonth()]}</div><div class="big${P.s0<0?' lo':''}">${fmt(P.s0)}</div><div class="lb" style="margin-top:4px">Receitas ${fmt(P.rec)} − reserva ${fmt(P.ap)} − gastos ${fmt(P.gasto)} − rateio sazonal ${fmt(P.sz)}</div><div style="margin-top:8px">Aporte máximo seguro (${Math.round(MARG*100)}% da sobra): <b>${fmt(a0.p)}</b> &nbsp; Distribuído às metas: <b>${fmt(dist)}</b></div>${P.rec<=0?`<p class="note">Ainda não há bolsa neste mês, então os aportes começam quando a renda do plano entrar.</p>`:''}${S.gl==0?`<p class="note">O gasto livre mensal estimado está zerado, então a sobra aparece maior que a real. Defina em Ajustes.</p>`:''}</div><div class="gl2">${cs}<button class="g gc nw" data-a="goal"><span style="font-size:30px">🎯</span><b>Nova meta</b><span class="lb">Viagem, notebook, curso, headset... defina um valor e acompanhe o progresso.</span></button></div><p class="note">Os gastos do mês contam o maior valor entre o que você lançou (menos o auxílio, sem as compras de metas) e a média dos últimos 3 meses, ou o gasto livre dos Ajustes. Quando as despesas sobem, a sobra cai e a data de compra se afasta; quando caem, ela se aproxima. Juros estimados com CDB 100% do CDI (CDI da aba Investir), com IR regressivo pelo prazo total (22,5% até 180 dias, caindo até 15%) e depósito no fim de cada mês. O IOF não entra: ele só pesa em resgate antes de 30 dias. Sem garan
